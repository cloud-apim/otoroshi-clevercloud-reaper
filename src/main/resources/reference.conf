otoroshi {
  admin-extensions {
    configurations {
      cloud-apim_extensions_clevercloudreaper {
        enabled = true
        enabled = ${?CLOUD_APIM_EXTENSIONS_CLEVERCLOUD_REAPER_ENABLED}
        clever {
          # the api tokens only work against the api bridge
          api-url = "https://api-bridge.clever-cloud.com"
          api-url = ${?CLEVER_CLOUD_API_URL}
          api-token = ${?CLEVER_CLOUD_API_TOKEN}
          # optional: the owner (orga_xxx or user_xxx) of the apps when the plugin config does not say it.
          # when absent, the owner of each app is discovered through /v2/summary
          owner-id = ${?CLEVER_CLOUD_OWNER_ID}
          timeout = 30000
          timeout = ${?CLEVER_CLOUD_API_TIMEOUT}
        }
        # evaluates everything and logs what would be reaped, but never stops an app
        dry-run = false
        dry-run = ${?CLOUD_APIM_EXTENSIONS_CLEVERCLOUD_REAPER_DRY_RUN}
        # the timezone of the 'must be up' time ranges when a route does not set its own
        timezone = "Europe/Paris"
        timezone = ${?CLOUD_APIM_EXTENSIONS_CLEVERCLOUD_REAPER_TIMEZONE}
        job {
          # every app is evaluated at this pace (millis)
          interval = 30000
          interval = ${?CLOUD_APIM_EXTENSIONS_CLEVERCLOUD_REAPER_JOB_INTERVAL}
          # apps waking up or shutting down are followed at this pace (millis)
          fast-interval = 5000
          fast-interval = ${?CLOUD_APIM_EXTENSIONS_CLEVERCLOUD_REAPER_JOB_FAST_INTERVAL}
        }
        # how often each node pushes the last access dates it saw (millis)
        access-flush-interval = 10000
        access-flush-interval = ${?CLOUD_APIM_EXTENSIONS_CLEVERCLOUD_REAPER_ACCESS_FLUSH_INTERVAL}
        # how many transitions are kept per app
        history-size = 100
        history-size = ${?CLOUD_APIM_EXTENSIONS_CLEVERCLOUD_REAPER_HISTORY_SIZE}
      }
    }
  }
}
