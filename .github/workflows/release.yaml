name: release

# Started by hand: Actions -> release -> Run workflow, with the version to release.
# Tests, builds the extension jar, tags the commit and publishes a github release with the jar and
# its sha-256 checksum.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0'
        required: true
        type: string
      skip_tests:
        description: 'Release without running the tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SCALA_VERSION: 3.8.4
  NAME: otoroshi-clevercloud-reaper

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check the version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "'${{ inputs.version }}' is not a version like 1.0.0 or 1.0.0-rc1" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}" > /dev/null; then
            echo "the tag ${{ inputs.version }} already exists" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - uses: coursier/cache-action@v6

      - name: set the version
        run: echo 'ThisBuild / version := "${{ inputs.version }}"' > version.sbt

      - name: test
        if: ${{ !inputs.skip_tests }}
        run: sbt -batch test

      - name: build
        run: |
          sbt -batch package
          mkdir -p dist
          cp "target/scala-$SCALA_VERSION/${NAME}_3-${{ inputs.version }}.jar" dist/
          cd dist
          shasum -a 256 "${NAME}_3-${{ inputs.version }}.jar" | cut -d ' ' -f 1 > "${NAME}_3-${{ inputs.version }}.jar.sha256"
          ls -la

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.version, '-') }}
          files: |
            dist/${{ env.NAME }}_3-${{ inputs.version }}.jar
            dist/${{ env.NAME }}_3-${{ inputs.version }}.jar.sha256
